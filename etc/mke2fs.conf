	# FEATURE              VERSION
	# 64bit              - 2.6.28
	# dir_nlink          - 2.6.28
	# extent             - 2.6.28
	# extra_isize        - 2.6.28
	# flex_bg            - 2.6.28
	# huge_file          - 2.6.28
	# meta_bg            - 2.6.28
	# uninit_bg          - 2.6.28
	# mmp                - 3.0
	# bigalloc           - 3.2
	# quota              - 3.6
	# inline_data        - 3.8
	# sparse_super2      - 3.16
	# metadata_csum      - 3.18
	# encrypt            - 4.1
	# metadata_csum_seed - 4.4
	# project            - 4.5
	# ea_inode           - 4.13
	# large_dir          - 4.13
	# casefold           - 5.2
	# verity             - 5.4
	# stable_inodes      - 5.5
	# orphan_file        - 5.15
	# fast_commit        - ?

	# Min 16 inodes per block group

	# Block group max size is 32768 blocks/clusters

[defaults]
	# NOTE: Removed `resize_inode` from current default
	base_features = sparse_super,large_file,filetype,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	# 128 MiB Block Group at 4 KiB blocks
	blocksize = 4096
	# Minimum 256-byte inodes, for extended timestamps, and years beyond 2038
	inode_size = 256
	inode_ratio = 16384

	### Additional defaults ###

	fs_type = ext4
	lazy_itable_init = 0
	lazy_journal_init = 0
	num_backup_sb = 2
	# 4 MiB per group, 32 MiB/GiB at 4 KiB blocks (default is 5.0)
	reserved_ratio = 3.125
	# 8 GiB Flex Group at 4 KiB blocks (default is 2 GiB)
	flex_bg_size = 64

[fs_types]
	ext3 = {
		features = has_journal
	}

	ext4 = {
		# NOTE: Removed `huge_file` and `orphan_file` from current default
		features = has_journal,extent,flex_bg,metadata_csum,metadata_csum_seed,64bit,dir_nlink,extra_isize
	}

	### BEGIN Upstream definitions

	# 3 MiB <= size < 512 MiB
	small = {
		# 8 MiB Block Group at 1 KiB blocks
		blocksize = 1024
		features = ^large_file
		# 1024 inodes per group, 128 inodes/MiB at 1 KiB blocks
		inode_ratio = 8192
	}

	# size < 3MiB
	floppy = {
		# 8 MiB Block Group at 1 KiB blocks
		blocksize = 1024
		features = ^large_file,^ext_attr,^has_journal,^extra_isize,inline_data,sparse_super2
		# 1365 inodes per group, ~170 inodes/MiB at 1 KiB blocks
		inode_ratio = 6144
		num_backup_sb = 1
		reserved_ratio = 0.0
	}

	# 4TiB <= size < 16TiB
	big = {
		# 1 GiB Block Group at 32 KiB clusters
		cluster_size = 32768
		# Because of `bigalloc`
		default_mntopts = nodelalloc
		features = huge_file,inline_data,extent,bigalloc
		# 32 GiB Flex Group at 32 KiB clusters
		flex_bg_size = 32
		# 1024 inodes per group, 1024 inodes/GiB at 32 KiB clusters
		inode_ratio = 1048576
	}

	# 16TiB <= size
	huge = {
		# 1 GiB Block Group at 32 KiB clusters
		cluster_size = 32768
		# Because of `bigalloc`
		default_mntopts = nodelalloc
		features = huge_file,inline_data,extent,bigalloc
		# 128 GiB Flex Group at 32 KiB clusters
		flex_bg_size = 128
		# 1024 inodes per group, 1024 inodes/GiB at 32 KiB clusters
		inode_ratio = 1048576
		# Data inlining
		inode_size = 4096
	}

	news = {
		# 32768 inodes per group, 256 inodes/MiB at 4 KiB blocks
		inode_ratio = 4096
	}

	largefile = {
		# 16 GiB Flex Group at 4 KiB blocks
		flex_bg_size = 128
		# 128 inodes per group, 1024 inodes/GiB at 4 KiB blocks
		inode_ratio = 1048576
		blocksize = -1
	}

	largefile4 = {
		# 32 GiB Flex Group at 4 KiB blocks
		flex_bg_size = 256
		# 32 inodes per group, 256 inodes/GiB at 4 KiB blocks
		inode_ratio = 4194304
		blocksize = -1
	}

	hurd = {
		# 32768 inodes per group, 256 inodes/MiB at 4 KiB blocks
		blocksize = 4096
		# Hurd only supports 128-byte inodes
		inode_size = 128
		warn_y2038_dates = 0
	}

	### END   Upstream definitions

	### BEGIN Block device type definitions

	hdd = {
		packed_meta_blocks=0
	}

	smr = {
		packed_meta_blocks=1
	}

	flash = {
		packed_meta_blocks=0
	}

	ssd = {
		packed_meta_blocks=1
	}

	nvme = {
		packed_meta_blocks=1
	}

	zns = {
		packed_meta_blocks=1
	}

	### END   Block device type definitions

	### BEGIN FHS definitions

	root = {
		features = inline_data,sparse_super2
		# 4096 inodes per group, 32 inodes/MiB at 4 KiB blocks
		inode_ratio = 32768
		# Data inlining
		inode_size = 512
		# 2 MiB per group, 16 MiB/GiB at 4 KiB blocks
		reserved_ratio = 1.5625
	}

	# GRUB 2.12 does not support:
	#     ea_inode, inline_data
	#     See: https://cgit.git.savannah.gnu.org/cgit/grub.git/tree/grub-core/fs/ext2.c
	# Turned off for because they are not needed:
	#     has_journal, large_file, huge_file, large_dir
	# Turned off for better compatibility:
	#     bigalloc, encrypt, metadata_csum, metadata_csum_seed, meta_bg, mmp, project, quota
	boot = {
		features = ^ea_inode,^inline_data,^has_journal,^large_file,^huge_file,^large_dir,^bigalloc,^encrypt,^metadata_csum,^metadata_csum_seed,^meta_bg,^mmp,^project,^quota,sparse_super2
		# 512 inodes per group, 4 inodes/MiB at 4 KiB blocks
		inode_ratio = 262144
		reserved_ratio = 0.0
	}

	opt = {
		features = inline_data,sparse_super2
		# 2048 inodes per group, 16 inodes/MiB at 4 KiB blocks
		inode_ratio = 65536
		# Data inlining
		inode_size = 512
		# 4 MiB per group, 32 MiB/GiB at 4 KiB blocks
		reserved_ratio = 3.125
	}

	usr = {
		features = inline_data,sparse_super2
		# 2048 inodes per group, 16 inodes/MiB at 4 KiB blocks
		inode_ratio = 65536
		# Data inlining
		inode_size = 512
		reserved_ratio = 0.0
	}

	var = {
		features = inline_data,sparse_super2
		# 2048 inodes per group, 16 inodes/MiB at 4 KiB blocks
		inode_ratio = 65536
		# Data inlining
		inode_size = 512
		# 4 MiB per group, 32 MiB/GiB at 4 KiB blocks
		reserved_ratio = 3.125
	}

	varlib = {
		features = inline_data,sparse_super2
		# 2048 inodes per group, 16 inodes/MiB at 4 KiB blocks
		inode_ratio = 65536
		# Data inlining
		inode_size = 512
		# 4 MiB per group, 32 MiB/GiB at 4 KiB blocks
		reserved_ratio = 3.125
	}

	vartmp = {
		features = inline_data,sparse_super2
		# 4096 inodes per group, 32 inodes/MiB at 4 KiB blocks
		inode_ratio = 32768
		# Data inlining
		inode_size = 512
		# 4 MiB per group, 32 MiB/GiB at 4 KiB blocks
		reserved_ratio = 3.125
	}

	home = {
		features = inline_data,sparse_super2
		# 2048 inodes per group, 16 inodes/MiB at 4 KiB blocks
		inode_ratio = 65536
		# Data inlining
		inode_size = 512
		reserved_ratio = 0.0
	}

	srv = {
		features = inline_data,sparse_super2
		# 2048 inodes per group, 16 inodes/MiB at 4 KiB blocks
		inode_ratio = 65536
		# Data inlining
		inode_size = 512
		reserved_ratio = 0.0
	}

	### END   FHS definitions

	### BEGIN Other definitions

	storage = {
		features = ^has_journal,inline_data,sparse_super2
		# 16 GiB Flex Group with 262144 inodes at 4 KiB blocks
		flex_bg_size = 128
		# 2048 inodes per group, 16 inodes/MiB at 4 KiB blocks
		inode_ratio = 65536
		# Data inlining
		inode_size = 512
		reserved_ratio = 0.0
	}

	storage-af = {
		features = ^has_journal,inline_data,sparse_super2
		# 16 GiB Flex Group with 131072 inodes at 4 KiB blocks
		flex_bg_size = 128
		# 1024 inodes per group, 8 inodes/MiB at 4 KiB blocks
		inode_ratio = 131072
		# One inode per block, data inlining
		inode_size = 4096
		reserved_ratio = 0.0
	}

	storage-mid = {
		features = ^has_journal,inline_data,sparse_super2
		# 32 GiB Flex Group with 65536 inodes at 4 KiB blocks
		flex_bg_size = 256
		# 256 inodes per group, 2 inodes/MiB at 4 KiB blocks
		inode_ratio = 524288
		# Data inlining
		inode_size = 512
		reserved_ratio = 0.0
	}

	storage-mid-af = {
		features = ^has_journal,inline_data,sparse_super2
		# 32 GiB Flex Group with 32768 inodes at 4 KiB blocks
		flex_bg_size = 256
		# 128 inodes per group, 1024 inodes/GiB at 4 KiB blocks
		inode_ratio = 1048576
		# One inode per block, data inlining
		inode_size = 4096
		reserved_ratio = 0.0
	}

	storage-big = {
		features = ^has_journal,inline_data,sparse_super2,extent,bigalloc
		# 512 MiB Block Group at 16 KiB clusters
		cluster_size = 16384
		# Because of `bigalloc`
		default_mntopts = nodelalloc
		# 128 GiB Flex Group with 65536 inodes at 16 KiB clusters
		flex_bg_size = 256
		# Data inlining
		inode_size = 512
		# 256 inodes per group, 512 inodes/GiB at 16 KiB clusters
		inode_ratio = 2097152
		reserved_ratio = 0.0
	}

	storage-big-af = {
		features = ^has_journal,inline_data,sparse_super2,extent,bigalloc
		# 512 MiB Block Group at 16 KiB clusters
		cluster_size = 16384
		# Because of `bigalloc`
		default_mntopts = nodelalloc
		# 128 GiB Flex Group with 32768 inodes at 16 KiB clusters
		flex_bg_size = 256
		# Data inlining
		inode_size = 4096
		# 128 inodes per group, 256 inodes/GiB at 16 KiB clusters
		inode_ratio = 4194304
		reserved_ratio = 0.0
	}

	storage-huge = {
		features = ^has_journal,inline_data,sparse_super2,extent,bigalloc
		# 2 GiB Block Group at 64 KiB clusters
		cluster_size = 65536
		# Because of `bigalloc`
		default_mntopts = nodelalloc
		# 128 GiB Flex Group with inodes at 64 KiB clusters
		flex_bg_size = 64
		# Data inlining
		inode_size = 4096
		# 32 inodes per group, 16 inodes/GiB at 64 KiB clusters
		inode_ratio = 67108864
		reserved_ratio = 0.0
	}

	### END   Other definitions
